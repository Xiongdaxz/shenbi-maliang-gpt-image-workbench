name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare ChatGPT Web Python runtime
        run: bun run setup:chatgpt-web

      - name: Type check
        run: bun run check

      - name: Bun tests
        run: bun test

      - name: ChatGPT Web bridge tests
        run: bun run test:chatgpt-web-bridge

      - name: Build
        run: bun run build
